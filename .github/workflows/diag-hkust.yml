name: HKUST links check (one-off)

# Which Interfolio link each HKUST job gets, old mapping vs new, on the live
# listing pages (scraper/diag_hkust.py). Read-only, no secrets. Runs on pushes to this branch only and is removed after use.
on:
  push:
    branches: ["claude/quirky-mendel-ro41pv"]
    paths:
      - ".github/workflows/diag-hkust.yml"
      - "scraper/diag_hkust.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check the HKUST links
        run: python diag_hkust.py
