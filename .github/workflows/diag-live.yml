name: Diag THEi (temporary)
on:
  push:
    branches: [claude/epic-lovelace-2w6gza]
    paths: [".github/workflows/diag-live.yml"]
permissions:
  contents: read
jobs:
  thei:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore Playwright browser
        id: pw-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}
      - run: pip install -r scraper/requirements.txt && playwright install --with-deps chromium
      - run: cd scraper && python -c "from sites.thei import scrape_thei; j = scrape_thei(); print(len(j), 'THEi jobs'); print(sorted(x['id'] for x in j))"
