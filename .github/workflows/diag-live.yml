name: Diag live site (temporary)
on:
  push:
    branches: [claude/epic-lovelace-2w6gza]
    paths: [".github/workflows/diag-live.yml"]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Live site
        run: |
          B=https://www.hkacadjobs.org
          curl -sfL "$B/?v=$(date +%s)" -o home.html
          grep -c "LATEST-JOBS:START" home.html
          grep -o 'supabase-js@[0-9.]*' home.html
          grep -c 'rel="canonical" href="https://www.hkacadjobs.org/"' home.html
          grep -c "welcomeOverlay" home.html || true
          curl -sf "$B/robots.txt"
          curl -sf -o /dev/null -w "favicon %{http_code}\n" "$B/favicon.svg"
          curl -s -o /dev/null -w "jobs-lite %{http_code}\n" "$B/jobs-lite.csv"
      - name: EdUHK links (legacy TLS fallback)
        run: |
          cd scraper && python - <<'PY'
          import csv, check_links as c
          rows = [r for r in csv.DictReader(open("../jobs.csv", encoding="utf-8")) if r["university"] == "EdUHK"][:5]
          for r in rows:
              print(r["id"], c.check(r["apply_url"]))
          PY
