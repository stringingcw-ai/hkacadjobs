name: Diag live scrapers (temporary)

# Temporary: runs only on pushes to the working branch to inspect live career
# sites from GitHub's network. Read-only, no secrets. Delete before merging.
on:
  push:
    branches: [claude/epic-lovelace-2w6gza]
    paths: ["scraper/_diag_live.py", ".github/workflows/diag-live.yml"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps
      - run: python scraper/_diag_live.py
