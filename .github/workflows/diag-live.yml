name: Diag HKUST (temporary)
on:
  push:
    branches: [claude/epic-lovelace-2w6gza]
    paths: [".github/workflows/diag-live.yml"]
permissions:
  contents: read
jobs:
  hkust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt && playwright install --with-deps chromium
      - run: cd scraper && python _diag_hkust.py
