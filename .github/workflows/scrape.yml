name: Daily Scraper

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC = 02:00 HKT
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright anthropic pypdf certifi
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/scraper.py

      - name: Patch HKU missing descriptions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/patch_hku_descriptions.py --reset-queue --all

      - name: Send job alert emails
        id: notify
        continue-on-error: true   # never block publishing; the health check below reports failures
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
        run: python scraper/notify.py

      - name: Generate job pages + sitemap
        run: python scraper/generate_job_pages.py

      - name: Commit and push jobs.csv + job pages + sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f jobs.csv sitemap.xml scraper/scrape_health.json scraper/job_registry.json
          git add -f jobs/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            DATE=$(date -u +"%d %b %Y")
            NEW=$(git diff --cached jobs.csv | grep "^+" | grep -c ",TRUE," || true)
            PAGES=$(find jobs/ -name "index.html" | wc -l | tr -d ' ')
            git commit -m "Data refresh: ${DATE} (${NEW} new, ${PAGES} job pages)"
            git fetch origin main
            git rebase -X ours origin/main
            git push
          fi

      # Runs after publishing so data still goes out. Fails the run (GitHub then
      # emails you) if any university crashed, came back empty or far below its
      # usual count, or if alert emails failed. Set the HEALTH_ALERT_EMAIL secret
      # to also get a Resend email with the details.
      - name: Check scrape health
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          HEALTH_ALERT_EMAIL: ${{ secrets.HEALTH_ALERT_EMAIL }}
        run: python scraper/health.py --notify-outcome "${{ steps.notify.outcome }}"
