name: Daily Scraper

on:
  schedule:
    # 17:37 UTC = 01:37 HKT. Off the top of the hour, when GitHub delays or
    # drops scheduled runs most.
    - cron: "37 17 * * *"
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

# Never run two scrapes at once (e.g. a manual run during the nightly one)
concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Restore Playwright browser
        id: pw-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      # Saved straight away, so a later failing step doesn't skip it
      - name: Save Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/scraper.py

      - name: Patch HKU missing descriptions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/patch_hku_descriptions.py --reset-queue --all

      - name: Generate job pages + sitemap
        run: python scraper/generate_job_pages.py

      - name: Commit and push jobs.csv + job pages + sitemap
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f jobs.csv jobs-lite.csv sitemap.xml index.html jobs/ \
            scraper/scrape_health.json scraper/job_registry.json scraper/pages_manifest.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            DATE=$(TZ=Asia/Hong_Kong date +"%d %b %Y")
            NEW=$(python -c "import csv; print(sum(r['is_new'] == 'TRUE' for r in csv.DictReader(open('jobs.csv', encoding='utf-8'))))")
            PAGES=$(find jobs/ -name "index.html" | wc -l | tr -d ' ')
            git commit -m "Data refresh: ${DATE} (${NEW} new, ${PAGES} job pages)"
            # On a conflict with a commit pushed meanwhile, today's data wins
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase -X theirs origin/main && git push; then
                echo "pushed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 10))
            done
            echo "::error::Could not push today's data"
            exit 1
          fi

      # Alert emails link to the new job pages, so wait until GitHub Pages
      # serves them (best effort, at most 8 minutes).
      - name: Wait for the site to update
        if: steps.publish.outputs.pushed == 'true'
        run: python scraper/wait_for_deploy.py

      - name: Send job alert emails
        id: notify
        continue-on-error: true   # never block publishing; the health check below reports failures
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
        run: python scraper/notify.py

      # Remembers which jobs each subscription was already sent, so nobody is
      # emailed about the same job twice.
      - name: Commit the alert log
        if: always() && steps.notify.outcome != 'skipped'
        run: |
          git add -f scraper/alert_log.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Alert log unchanged"
          else
            git commit -m "Alert log: $(TZ=Asia/Hong_Kong date +'%d %b %Y')"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase -X theirs origin/main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 10))
            done
            echo "::error::Could not push the alert log; some people may get a repeat email tomorrow"
            exit 1
          fi

      # Runs last so data still goes out. Fails the run (GitHub then emails
      # you) if any university crashed, came back empty or far below its
      # usual count, or if alert emails failed. Set the HEALTH_ALERT_EMAIL
      # secret to also get a Resend email with the details.
      - name: Check scrape health
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          HEALTH_ALERT_EMAIL: ${{ secrets.HEALTH_ALERT_EMAIL }}
        run: python scraper/health.py --notify-outcome "${{ steps.notify.outcome }}"
