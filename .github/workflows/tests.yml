name: Tests

on:
  push:
    branches: [main]
    paths: ["scraper/**", "index.html", "supabase/functions/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["scraper/**", "index.html", "supabase/functions/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt pytest==9.1.1 pyflakes==4.0.0

      - name: Lint
        run: python -m pyflakes scraper

      - name: Unit tests
        run: python -m pytest -q scraper/tests

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/match-jobs
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x

      - name: Format, lint, type-check and test match-jobs
        run: deno task check
