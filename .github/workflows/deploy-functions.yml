name: Deploy functions

# Deploys the Supabase Edge Functions in supabase/functions whenever they change
# on main, after their checks pass. Needs the SUPABASE_ACCESS_TOKEN and
# SUPABASE_PROJECT_REF repository secrets; until they exist it only runs the checks.

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x

      # Never deploy code that fails its own checks
      - name: Check match-jobs
        working-directory: supabase/functions/match-jobs
        run: deno task check

      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Not deployed: add the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets (see README, CV matching service)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v3
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 2.118.0

      # --use-api bundles on Supabase's side, so no Docker is needed
      - name: Deploy match-jobs
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy match-jobs --project-ref "$SUPABASE_PROJECT_REF" --use-api
