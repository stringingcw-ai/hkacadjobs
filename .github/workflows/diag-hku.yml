name: HKU listing check (one-off)

# Dry run of the rewritten HKU scraper against HKU's new careers site, compared with
# jobs.csv (scraper/diag_hku.py). Read-only, no secrets. Runs on pushes to this branch
# only and is removed after use.
on:
  push:
    branches: ["claude/quirky-mendel-ro41pv"]
    paths:
      - ".github/workflows/diag-hku.yml"
      - "scraper/diag_hku.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dry-run the HKU scraper
        run: python diag_hku.py
