name: HKU listing check (one-off)

# What HKU's job listing returns to a GitHub runner, as a plain request and in a browser,
# after the 20 Nov 2026 run got a page with no job links (scraper/diag_hku.py). Read-only,
# no secrets. Runs on pushes to this branch only and is removed after use.
on:
  push:
    branches: ["claude/quirky-mendel-ro41pv"]
    paths:
      - ".github/workflows/diag-hku.yml"
      - "scraper/diag_hku.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check the HKU listing
        run: python diag_hku.py
